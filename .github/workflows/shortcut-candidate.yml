name: Windows foreground shortcut regression
on:
  push:
    branches: [codex/windows-settings-autosave]
permissions:
  contents: read
  checks: write
jobs:
  regression:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.93.1
          targets: x86_64-pc-windows-msvc
          components: clippy
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: src-tauri/target
          key: windows-shortcut-debug-rust-1.93.1-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-shortcut-debug-rust-1.93.1-${{ hashFiles('src-tauri/Cargo.lock') }}-
            windows-2022-rust-1.93.1-${{ hashFiles('src-tauri/Cargo.lock') }}-
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: npm ci
      - run: npm run check
      - run: npx tauri build --debug --target x86_64-pc-windows-msvc --no-bundle --ci -- --locked
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: src-tauri/target
          key: windows-shortcut-debug-rust-1.93.1-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}
      - run: cargo test --locked --target x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml windows_physical_listener_receives_f8_edges -- --ignored --test-threads=1
      - run: ./scripts/shortcut-candidate.ps1
      - run: cargo test --locked --target x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --target x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: Windows-shortcut-test-results
          path: release/shortcut-repro/results.json
          retention-days: 14
