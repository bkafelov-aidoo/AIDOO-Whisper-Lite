name: Reproduce Windows shortcut capture and foreground input
on:
  push:
    branches: [codex/whisper-lite-shortcut-repro]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Download the verified existing installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41877349988 --repo bkafelov-aidoo/AIDOO-Whisper-Lite --name AIDOO-Whisper-Lite-Windows-x64-signed --dir release/input
      - name: Test existing application without microphone or API calls
        run: ./scripts/shortcut-repro.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: Windows-shortcut-test-results
          retention-days: 14
          if-no-files-found: error
          path: release/shortcut-repro/results.json
